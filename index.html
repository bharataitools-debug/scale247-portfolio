.bar button{width:36px;height:36px;border:0;border-radius:50%;background:#ff6a13;color:#111;font-size:18px;font-weight:700;cursor:pointer;line-height:1}
.bar button:disabled{background:#3a3a3a;color:#777;cursor:default}
.bar button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.bar span{min-width:64px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.prog{position:fixed;top:0;left:0;height:3px;width:0;background:#ff6a13;z-index:6}
@media (max-width:600px){main{padding:8px 8px 68px;gap:8px}.pg{border-radius:6px}}

<script>
(function(){
var pgs=[].slice.call(document.querySelectorAll('.pg')),n=pgs.length,cur=0;
var count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next'),prog=document.getElementById('prog');
function update(){
  var mid=window.innerHeight/2,best=0,bd=1e9,max0=document.documentElement.scrollHeight-window.innerHeight;
  for(var i=0;i<n;i++){var r=pgs[i].getBoundingClientRect(),d=Math.abs((r.top+r.bottom)/2-mid);if(d<bd){bd=d;best=i}}
  if(window.scrollY<=2)best=0;else if(window.scrollY>=max0-2)best=n-1;
  cur=best;count.textContent=(cur+1)+' / '+n;prev.disabled=cur===0;next.disabled=cur===n-1;
  var max=document.documentElement.scrollHeight-window.innerHeight;prog.style.width=(max>0?window.scrollY/max*100:0)+'%';
}
function go(i){i=Math.max(0,Math.min(n-1,i));pgs[i].scrollIntoView({block:'center'})}
prev.addEventListener('click',function(){go(cur-1)});next.addEventListener('click',function(){go(cur+1)});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
});
var t=false;window.addEventListener('scroll',function(){if(!t){t=true;requestAnimationFrame(function(){update();t=false})}},{passive:true});
window.addEventListener('resize',update);update();
})();
</script>
